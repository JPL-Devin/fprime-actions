name: 'Enable ccache'
description: 'Install and enable ccache backed by the GitHub Actions cache'
inputs:
  max-size:
    description: "Maximum size of the compiler cache"
    required: false
    default: "800M"
  key-suffix:
    description: "Extra cache key discriminator (e.g. a matrix value) so parallel matrix legs keep separate caches"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
  - name: "Install ccache"
    run: |
      if ! command -v ccache > /dev/null 2>&1
      then
          if [ "${RUNNER_OS}" = "macOS" ]
          then
              brew install ccache
          else
              sudo apt-get install -y ccache
          fi
      fi
    shell: bash
  # CMake (>= 3.17) reads the CMAKE_<LANG>_COMPILER_LAUNCHER environment
  # variables at generate time, so exporting them here enables ccache for
  # every subsequent fprime-util generate/build without build-system changes.
  - name: "Configure ccache"
    run: |
      echo "CCACHE_DIR=${HOME}/.ccache" >> $GITHUB_ENV
      echo "CCACHE_MAXSIZE=${{ inputs.max-size }}" >> $GITHUB_ENV
      echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
      echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
    shell: bash
  # The exact key is unique per run so the post-job save always stores an
  # updated cache; restore-keys falls back to the most recent cache for the
  # same workflow/job. Caches saved on devel are readable from PR branches.
  - name: "Cache compiler output"
    uses: actions/cache@v4
    with:
      path: ~/.ccache
      key: ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}${{ inputs.key-suffix }}-${{ github.run_id }}
      restore-keys: |
        ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}${{ inputs.key-suffix }}-
  - name: "Reset ccache statistics"
    run: ccache -z
    shell: bash
