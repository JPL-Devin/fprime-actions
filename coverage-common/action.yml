name: "F´ Coverage (common)"
description: >
  Shared coverage generation used by coverage-check (PR-only) and
  coverage-update (push-only).  Discovers F´ modules, runs gcovr globally
  and per-module, and produces summary.json + coverage HTML outputs.
  Assumes the caller has already run generate + build (e.g. via the
  run-unit-tests action with run-check: 'false').
inputs:
  working-directory:
    description: "Directory to run fprime-util from"
    required: false
    default: "."
  target-platform:
    description: "Target platform/toolchain passed to fprime-util (e.g. native)"
    required: false
    default: ""
  jobs:
    description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
    required: false
    default: ""
  strict:
    description: >
      When 'true', fail the action if any module's UT/coverage build fails.
      Default 'false' so individual module failures surface as missing
      summary.json (rendered as "no coverage" in the PR comment / catalog)
      without failing the whole CI job.
    required: false
    default: "false"
  enable-fw-assert-branch-coverage:
    description: >
      When 'true', include FW_ASSERT branches in branch coverage.
      By default FW_ASSERT branches are excluded because each
      FW_ASSERT(cond) expands to a ternary whose error path is
      virtually never tested, inflating uncovered-branch counts.
    required: false
    default: "false"
  debug:
    description: >
      When 'true', forward gcovr's verbose output (-v) for the global and
      per-module steps.  Useful for diagnosing slow or stuck coverage runs.
    required: false
    default: "false"
outputs:
  modules-jsonl:
    description: "Path to the JSON-Lines file listing discovered modules"
    value: ${{ steps.discover.outputs.modules-jsonl }}

runs:
  using: "composite"
  steps:
    - name: "Discover modules"
      id: discover
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "${ACTION_PATH}/scripts/discover.py" --root . > modules.jsonl
        echo "modules-jsonl=$(pwd)/modules.jsonl" >> "$GITHUB_OUTPUT"
        echo "Discovered $(wc -l < modules.jsonl) modules"

    - name: "Global coverage (fprime-util check --all --coverage)"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        JOBS_INPUT: ${{ inputs.jobs }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        DEBUG: ${{ inputs.debug }}
      run: |
        JOBS_FLAG=""
        if [ "${JOBS_INPUT}" = "random" ]; then
          JOBS=$(( (RANDOM % 32) + 1 ))
          JOBS_FLAG="-j${JOBS}"
        elif [ -n "${JOBS_INPUT}" ]; then
          JOBS_FLAG="-j${JOBS_INPUT}"
        fi
        VERBOSE_FLAG=""
        if [ "${DEBUG}" = "true" ]; then
          VERBOSE_FLAG="-v"
        fi
        # --gcov-ignore-parse-errors handles the known gcov-11 counter
        # overflow (gcc#68080) defensively.  With gcov-12+ it should
        # never fire, but it's cheap insurance against future toolchain
        # regressions.
        FW_ASSERT_FLAGS="--exclude-branches-by-pattern .*FW_ASSERT\\(.*"
        if [ "${{ inputs.enable-fw-assert-branch-coverage }}" = "true" ]; then
          FW_ASSERT_FLAGS=""
        fi
        fprime-util check --all --coverage ${JOBS_FLAG} ${TARGET_PLATFORM} \
          --pass-through --json-summary coverage/summary.json \
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
          --exclude-throw-branches \
          --exclude-unreachable-branches \
          ${FW_ASSERT_FLAGS} \
          ${VERBOSE_FLAG}

    - name: "Per-module coverage"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        MODULES_JSONL: ${{ steps.discover.outputs.modules-jsonl }}
        STRICT: ${{ inputs.strict }}
        ENABLE_FW_ASSERT: ${{ inputs.enable-fw-assert-branch-coverage }}
        DEBUG: ${{ inputs.debug }}
      run: |
        STRICT_FLAG=""
        if [ "${STRICT}" = "true" ]; then
          STRICT_FLAG="--strict"
        fi
        FW_ASSERT_FLAG=""
        if [ "${ENABLE_FW_ASSERT}" = "true" ]; then
          FW_ASSERT_FLAG="--enable-fw-assert-branch-coverage"
        fi
        DEBUG_FLAG=""
        if [ "${DEBUG}" = "true" ]; then
          DEBUG_FLAG="--debug"
        fi
        python3 "${ACTION_PATH}/scripts/run_coverage.py" \
          --root . \
          --modules-jsonl "$MODULES_JSONL" \
          --target-platform "${TARGET_PLATFORM}" \
          ${STRICT_FLAG} \
          ${FW_ASSERT_FLAG} \
          ${DEBUG_FLAG}
