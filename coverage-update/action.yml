name: "F´ Coverage (update)"
description: >
  Mirror coverage outputs onto the coverage/<ref> orphan branch.  Call
  coverage-common (or coverage-integration-common) first to produce the
  coverage outputs, then pass its 'modules-jsonl' output into this action.

  This action only writes the coverage-<kind> subdirectories for the
  current kind.  The other kind's data is preserved on the branch so
  unit-test and integration coverage share the same branch and the
  combined landing page includes both.
inputs:
  working-directory:
    description: "Directory the coverage outputs were produced in (should match coverage-common)"
    required: false
    default: "."
  modules-jsonl:
    description: "Path to the JSON-Lines file produced by coverage-common (modules-jsonl output)"
    required: true
  coverage-kind:
    description: >
      Coverage kind slug (e.g. 'ut', 'integration-linux',
      'integration-hil-arm').  Controls the subdirectory name used
      on the baseline branch (coverage-<kind>/).  For integration
      coverage, pass the output of coverage-integration-common's
      'coverage-kind' output.
    required: false
    default: "ut"
  baseline-branch-prefix:
    description: "Prefix applied to <ref> to form the baseline branch name"
    required: false
    default: "coverage"
  ref:
    description: "The git ref whose coverage is being recorded (e.g. devel)"
    required: false
    default: ${{ github.ref_name }}

runs:
  using: "composite"
  steps:
    - name: "Resolve baseline branch"
      id: resolve
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        PREFIX: ${{ inputs.baseline-branch-prefix }}
      run: |
        BASELINE_BRANCH="${PREFIX}/${REF}"
        echo "baseline-branch=${BASELINE_BRANCH}" >> "$GITHUB_OUTPUT"
        echo "Publishing to ${BASELINE_BRANCH}"

    - name: "Checkout or create baseline worktree"
      id: worktree
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        BASELINE_BRANCH: ${{ steps.resolve.outputs.baseline-branch }}
      run: |
        BASELINE_DIR="${RUNNER_TEMP:-/tmp}/fprime-coverage-baseline"
        rm -rf "$BASELINE_DIR"
        if git fetch origin "${BASELINE_BRANCH}:refs/remotes/origin/${BASELINE_BRANCH}" 2>/dev/null; then
          git worktree add --detach "$BASELINE_DIR" "origin/${BASELINE_BRANCH}"
        else
          echo "::notice::Creating new orphan branch ${BASELINE_BRANCH}"
          git worktree add --detach "$BASELINE_DIR"
          cd "$BASELINE_DIR"
          git checkout --orphan "$BASELINE_BRANCH"
          git rm -rf --quiet . 2>/dev/null || true
          git commit --allow-empty -m "chore: seed ${BASELINE_BRANCH} coverage branch"
        fi
        echo "baseline-dir=${BASELINE_DIR}" >> "$GITHUB_OUTPUT"

    - name: "Mirror coverage outputs"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        COMMON_PATH: ${{ github.action_path }}/../coverage-common
        BASELINE_DIR: ${{ steps.worktree.outputs.baseline-dir }}
        MODULES_JSONL: ${{ inputs.modules-jsonl }}
        COVERAGE_KIND: ${{ inputs.coverage-kind }}
        REF: ${{ inputs.ref }}
        COMMIT: ${{ github.sha }}
      run: |
        python3 "${COMMON_PATH}/scripts/mirror.py" \
          --source . \
          --dest "$BASELINE_DIR" \
          --modules-jsonl "$MODULES_JSONL" \
          --coverage-kind "$COVERAGE_KIND" \
          --ref "$REF" \
          --ref-type branch \
          --commit "$COMMIT" \
          --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

    - name: "Commit and push"
      shell: bash
      env:
        BASELINE_DIR: ${{ steps.worktree.outputs.baseline-dir }}
        BASELINE_BRANCH: ${{ steps.resolve.outputs.baseline-branch }}
        COVERAGE_KIND: ${{ inputs.coverage-kind }}
        REF: ${{ inputs.ref }}
        COMMIT: ${{ github.sha }}
        GIT_AUTHOR_NAME: "github-actions[bot]"
        GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
        GIT_COMMITTER_NAME: "github-actions[bot]"
        GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
      run: |
        cd "$BASELINE_DIR"
        git add --all
        if git diff --cached --quiet; then
          echo "::notice::No coverage changes to commit."
          exit 0
        fi
        git commit -m "chore: update ${COVERAGE_KIND} coverage for ${REF}@${COMMIT:0:12}"
        git push origin "HEAD:refs/heads/${BASELINE_BRANCH}"
