name: 'Enable ccache'
description: 'Install and enable ccache backed by the GitHub Actions cache'
inputs:
  max-size:
    description: "Maximum size of the compiler cache"
    required: false
    default: "800M"
  key-suffix:
    description: "Extra cache key discriminator (e.g. a matrix value) so parallel matrix legs keep separate caches"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
  - name: "Install ccache"
    run: |
      if ! command -v ccache > /dev/null 2>&1
      then
          if [ "${RUNNER_OS}" = "macOS" ]
          then
              brew install ccache
          else
              sudo apt-get install -y ccache
          fi
      fi
    shell: bash
  # CMake (>= 3.17) reads the CMAKE_<LANG>_COMPILER_LAUNCHER environment
  # variables at generate time, so exporting them here enables ccache for
  # every subsequent fprime-util generate/build without build-system changes.
  - name: "Configure ccache"
    run: |
      echo "CCACHE_DIR=${HOME}/.ccache" >> $GITHUB_ENV
      echo "CCACHE_MAXSIZE=${{ inputs.max-size }}" >> $GITHUB_ENV
      echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
      echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> $GITHUB_ENV
    shell: bash
  # GitHub scopes caches saved from a pull_request run to that PR's merge
  # ref, so they are invisible to every other PR and only crowd out the
  # repository's shared 10 GB cache quota.  PR runs therefore restore-only,
  # falling back (via restore-keys) to the cache seeded from the default
  # branch (nightly schedule / push / dispatch runs), which every PR can
  # read.  Non-PR runs use the full cache action: its exact key is unique
  # per run so the post-job save always stores an updated cache.
  - name: "Cache compiler output (restore only)"
    if: github.event_name == 'pull_request'
    uses: actions/cache/restore@v4
    with:
      path: ~/.ccache
      key: ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}${{ inputs.key-suffix }}-${{ github.run_id }}
      restore-keys: |
        ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}${{ inputs.key-suffix }}-
  - name: "Cache compiler output"
    if: github.event_name != 'pull_request'
    uses: actions/cache@v4
    with:
      path: ~/.ccache
      key: ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}${{ inputs.key-suffix }}-${{ github.run_id }}
      restore-keys: |
        ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.job }}${{ inputs.key-suffix }}-
  - name: "Reset ccache statistics"
    run: ccache -z
    shell: bash
