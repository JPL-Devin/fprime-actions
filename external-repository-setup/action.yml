name: 'Setup External Repository w/ Branch Setup'
description: 'Setup the F´ repository and tools'
inputs:
  target_repository:
    description: "External repository to checkout (<owner>/<repo>)"
    required: true
    type: string
  fprime_location:
    description: "Relative path from the external project root to its F´ submodule"
    required: false
    type: string
    default: "./lib/fprime"
  target_ref:
    description: "Branch on target repository to checkout"
    required: false
    type: string
    default: "devel"
  overlay_location:
    description: "Relative path in the external project where the current repository is overlaid. Defaults to fprime_location (overlaying F´ itself)."
    required: false
    type: string
    default: ""
  stage: 
    description: "Stage of the CI process"
    required: false
    default: "all"
    type: string
runs:
  using: "composite"
  steps:
    # Self-hosted runners reuse the workspace; locks orphaned by a killed git
    # process survive actions/checkout's clean and break every later checkout.
    - name: "Remove stale git lock files"
      run: |
        find "${GITHUB_WORKSPACE}" -path '*/.git/*' -name '*.lock' -print -delete
        find "${GITHUB_WORKSPACE}" -path '*/.git/objects/*' \( -name 'tmp_pack_*' -o -name 'tmp_obj_*' -o -name 'tmp_idx_*' \) -print -delete
      shell: bash
    - name: "Checkout target repository"
      uses: actions/checkout@v5
      with:
        submodules: recursive 
        repository: ${{ inputs.target_repository }}
        ref: ${{ inputs.target_ref }}
        fetch-tags: true
        persist-credentials: false
    - name: "Overlay current repository revision"
      uses: actions/checkout@v5
      with:
        submodules: recursive
        path: ${{ inputs.overlay_location != '' && inputs.overlay_location || inputs.fprime_location }}
        ref: ${{ github.ref }}
        fetch-tags: true
        persist-credentials: false
    # Cache pip's download/wheel cache so requirement installs avoid
    # re-downloading packages on every job.
    - name: "Cache pip downloads"
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/Library/Caches/pip
        key: pip-${{ runner.os }}-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          pip-${{ runner.os }}-
    - name: "Enable ccache"
      if: ${{ inputs.stage == 'all' || inputs.stage == 'build' }}
      uses: nasa/fprime-actions/ccache@devel
    - name: "Base Python"
      run: |
        python3 -m venv ci-venv
        . ci-venv/bin/activate
        pip install -U setuptools pip wheel
        echo PATH=${GITHUB_WORKSPACE}/ci-venv/bin:$PATH >> $GITHUB_ENV
        echo VIRTUAL_ENV=${GITHUB_WORKSPACE}/ci-venv >> $GITHUB_ENV
      shell: bash
    - name: "Install requirements.txt"
      run: |
        pip install -r ${{ inputs.fprime_location }}/requirements.txt
        if [ -f ./requirements.txt ]
        then
            pip install -r ./requirements.txt
        fi
      shell: bash
    - name: "Install CI tooling"
      run: |
        pip install git+https://github.com/fprime-community/fprime-ci@devel
      shell: bash
    - name: "Custom repository setup"
      if: ${{ hashFiles('./.github/actions/setup/*') != '' }}
      uses: ./.github/actions/setup
      with:
        stage: ${{ inputs.stage }}
    - name: "Version Check"
      run: |
        pip freeze
        fprime-util version-check --all-submodules
      shell: bash