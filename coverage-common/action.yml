name: "F´ Coverage (common)"
description: >
  Shared coverage generation used by coverage-check (PR-only) and
  coverage-update (push-only).  Discovers F´ modules, runs gcovr globally
  and per-module, and renames each module's coverage.html to index.html.
  Assumes the caller has already run generate + build (e.g. via the
  run-unit-tests action with run-check: 'false').
inputs:
  working-directory:
    description: "Directory to run fprime-util from"
    required: false
    default: "."
  target-platform:
    description: "Target platform/toolchain passed to fprime-util (e.g. native)"
    required: false
    default: ""
  jobs:
    description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
    required: false
    default: ""
  strict:
    description: >
      When 'true', fail the action if any module's UT/coverage build fails.
      Default 'false' so individual module failures surface as missing
      summary.json (rendered as "no coverage" in the PR comment / catalog)
      without failing the whole CI job.
    required: false
    default: "false"
  debug:
    description: >
      When 'true', forward gcovr's verbose output (-v) for the global and
      per-module steps.  Useful for diagnosing slow or stuck coverage runs.
    required: false
    default: "false"
  mode:
    description: >
      'check' (default) builds/runs unit tests then gcovr per module.
      'coverage' runs gcovr only, splitting coverage data already on disk
      (e.g. from an instrumented integration-test run) per module without
      re-running any tests.
    required: false
    default: "check"
  project-root:
    description: >
      CMake project root passed to fprime-util (-r) in 'coverage' mode:
      the deployment project that owns the instrumented build cache
      (e.g. the Ref deployment's project directory).
    required: false
    default: ""
  include-autocoder-modules:
    description: >
      When 'true', also list autocoder-only modules (no hand-written C/C++
      source, e.g. types/ports-only modules) in coverage listings.  Off by
      default.
    required: false
    default: "false"
outputs:
  modules-jsonl:
    description: "Path to the JSON-Lines file listing discovered modules"
    value: ${{ steps.discover.outputs.modules-jsonl }}

runs:
  using: "composite"
  steps:
    - name: "Discover modules"
      id: discover
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        INCLUDE_AUTOCODER: ${{ inputs.include-autocoder-modules }}
      run: |
        DISCOVER_FLAGS=""
        if [ "${INCLUDE_AUTOCODER}" = "true" ]; then
          DISCOVER_FLAGS="--include-autocoder-only"
        fi
        python3 "${ACTION_PATH}/scripts/discover.py" --root . ${DISCOVER_FLAGS} > modules.jsonl
        echo "modules-jsonl=$(pwd)/modules.jsonl" >> "$GITHUB_OUTPUT"
        echo "Discovered $(wc -l < modules.jsonl) modules"

    - name: "Global coverage"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        JOBS_INPUT: ${{ inputs.jobs }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        MODE: ${{ inputs.mode }}
        PROJECT_ROOT: ${{ inputs.project-root }}
        DEBUG: ${{ inputs.debug }}
      run: |
        JOBS_FLAG=""
        if [ "${JOBS_INPUT}" = "random" ]; then
          JOBS=$(( (RANDOM % 32) + 1 ))
          JOBS_FLAG="-j${JOBS}"
        elif [ -n "${JOBS_INPUT}" ]; then
          JOBS_FLAG="-j${JOBS_INPUT}"
        fi
        VERBOSE_FLAG=""
        if [ "${DEBUG}" = "true" ]; then
          VERBOSE_FLAG="-v"
        fi
        # --gcov-ignore-parse-errors handles the known gcov-11 counter
        # overflow (gcc#68080) defensively.  With gcov-12+ it should
        # never fire, but it's cheap insurance against future toolchain
        # regressions.
        BASE_CMD="check --all --coverage"
        ROOT_FLAG=""
        EXTRA_FILTER=""
        if [ "${MODE}" = "coverage" ]; then
          # gcovr-only: reuse coverage data already on disk, no test run
          BASE_CMD="coverage --all"
          # The global gcovr filter is the deployment project's root; also
          # include this working tree so framework modules are reported.
          EXTRA_FILTER="--filter $(pwd)"
        fi
        if [ -n "${PROJECT_ROOT}" ]; then
          ROOT_FLAG="-r ${PROJECT_ROOT}"
        fi
        fprime-util ${BASE_CMD} ${JOBS_FLAG} ${TARGET_PLATFORM} ${ROOT_FLAG} \
          --pass-through --json-summary coverage/summary.json \
          --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
          ${EXTRA_FILTER} ${VERBOSE_FLAG}

    - name: "Per-module coverage"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
        MODULES_JSONL: ${{ steps.discover.outputs.modules-jsonl }}
        MODE: ${{ inputs.mode }}
        PROJECT_ROOT: ${{ inputs.project-root }}
        STRICT: ${{ inputs.strict }}
        DEBUG: ${{ inputs.debug }}
      run: |
        STRICT_FLAG=""
        if [ "${STRICT}" = "true" ]; then
          STRICT_FLAG="--strict"
        fi
        DEBUG_FLAG=""
        if [ "${DEBUG}" = "true" ]; then
          DEBUG_FLAG="--debug"
        fi
        python3 "${ACTION_PATH}/scripts/run_coverage.py" \
          --root . \
          --modules-jsonl "$MODULES_JSONL" \
          --target-platform "${TARGET_PLATFORM}" \
          --mode "${MODE}" \
          --project-root "${PROJECT_ROOT}" \
          ${STRICT_FLAG} \
          ${DEBUG_FLAG}
