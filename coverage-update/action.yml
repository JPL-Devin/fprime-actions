name: "F´ Coverage (update)"
description: >
  Mirror coverage outputs (produced by coverage-common) to the
  per-base-branch orphan branch (coverage/<ref-name>).  Intended to run
  on push events (devel, release/**, tags) with permissions:
  { contents: write }.  Skipped on fork pushes.  Call the coverage-common
  action first and pass its 'modules-jsonl' output into this action.
inputs:
  working-directory:
    description: "Directory the coverage outputs were produced in (should match coverage-common)"
    required: false
    default: "."
  modules-jsonl:
    description: "Path to the JSON-Lines file produced by coverage-common (modules-jsonl output)"
    required: true
  baseline-branch-prefix:
    description: "Prefix applied to <ref-name> to form the baseline branch name"
    required: false
    default: "coverage"
  coverage-subdirectory:
    description: >
      Subdirectory under each module in the baseline branch holding coverage
      artifacts.  Set to "" to flatten (drop the shadow folder).
    required: false
    default: "coverage"
  int-coverage-subdirectory:
    description: >
      Subdirectory under each module (and at the root) in the baseline branch
      holding integration coverage artifacts.
    required: false
    default: "int-coverage"
  artifact:
    description: >
      Which coverage artifact the working tree holds: 'ut' (unit-test,
      default) or 'int' (integration-test); selects the destination
      subdirectory in the baseline branch.
    required: false
    default: "ut"
  config-file:
    description: >
      Path (relative to working-directory) of the checklist config file
      holding badge-tier thresholds and future reporting settings.
      Defaults apply when the file does not exist.
    required: false
    default: ".github/module-checklist.yml"

outputs:
  catalog-path:
    description: "Absolute path to the generated catalog.json"
    value: ${{ steps.catalog.outputs.catalog-path }}
  baseline-branch:
    description: "Name of the baseline branch that was written"
    value: ${{ steps.catalog.outputs.baseline-branch }}

runs:
  using: "composite"
  steps:
    - name: "Compute ref / ref-type"
      id: ref
      shell: bash
      env:
        REF: ${{ github.ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        echo "ref-name=${REF_NAME}" >> "$GITHUB_OUTPUT"
        case "$REF" in
          refs/tags/*) echo "ref-type=tag"    >> "$GITHUB_OUTPUT" ;;
          *)           echo "ref-type=branch" >> "$GITHUB_OUTPUT" ;;
        esac

    - name: "Mirror to baseline branch"
      id: catalog
      if: github.event.repository.fork == false
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        COMMON_PATH: ${{ github.action_path }}/../coverage-common
        BASELINE_PREFIX: ${{ inputs.baseline-branch-prefix }}
        REF_NAME: ${{ steps.ref.outputs.ref-name }}
        REF_TYPE: ${{ steps.ref.outputs.ref-type }}
        SUBDIR: ${{ inputs.coverage-subdirectory }}
        INT_SUBDIR: ${{ inputs.int-coverage-subdirectory }}
        ARTIFACT: ${{ inputs.artifact }}
        MODULES_JSONL: ${{ inputs.modules-jsonl }}
        COMMIT_SHA: ${{ github.sha }}
        CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        set -e
        BASELINE_BRANCH="${BASELINE_PREFIX}/${REF_NAME}"
        echo "baseline-branch=${BASELINE_BRANCH}" >> "$GITHUB_OUTPUT"
        echo "catalog-path=${RUNNER_TEMP:-/tmp}/fprime-baseline-publish/catalog.json" >> "$GITHUB_OUTPUT"

        # Resolve the config path against the source checkout so it is still
        # found when the mirror command runs against the baseline worktree.
        CONFIG_ABS="$(pwd)/${CONFIG_FILE}"
        export CONFIG_ABS

        bash "${COMMON_PATH}/scripts/publish_baseline.sh" \
          "$BASELINE_BRANCH" "$COMMIT_SHA" "coverage" \
          bash -c 'python3 "${COMMON_PATH}/scripts/mirror.py" \
            --source . \
            --dest "$BASELINE_DIR" \
            --modules-jsonl "$MODULES_JSONL" \
            --coverage-subdirectory "$SUBDIR" \
            --int-coverage-subdirectory "$INT_SUBDIR" \
            --artifact "$ARTIFACT" \
            --ref "$REF_NAME" \
            --ref-type "$REF_TYPE" \
            --commit "$COMMIT_SHA" \
            --config "$CONFIG_ABS"'
