name: "F´ Coverage (check)"
description: >
  Compare per-module + global gcovr coverage against the matching
  coverage/<base_ref> baseline branch and upload the resulting comment
  body as a workflow artifact.  Intended to run on pull_request events
  with permissions: { contents: read } only.  A companion
  coverage-comment action, triggered from a workflow_run job with
  permissions: pull-requests: write, downloads the artifact and posts
  the sticky PR comment.  This two-stage split is the GitHub-recommended
  pattern for commenting on pull requests opened from forks, since
  GitHub strips write permissions from GITHUB_TOKEN on fork-triggered
  pull_request events.

  Call the coverage-common (or coverage-integration-common) action first
  to produce the coverage outputs and pass its 'modules-jsonl' output
  into this action.
inputs:
  working-directory:
    description: "Directory the coverage outputs were produced in (should match coverage-common)"
    required: false
    default: "."
  modules-jsonl:
    description: "Path to the JSON-Lines file produced by coverage-common (modules-jsonl output)"
    required: true
  coverage-kind:
    description: >
      Coverage kind slug (e.g. 'ut', 'integration-linux',
      'integration-hil-arm').  Controls the baseline subdirectory
      used for comparison (coverage-<kind>/).  For integration
      coverage, pass the output of coverage-integration-common's
      'coverage-kind' output.
    required: false
    default: "ut"
  baseline-branch-prefix:
    description: "Prefix applied to <base-ref> to form the baseline branch name"
    required: false
    default: "coverage"
  regression-threshold:
    description: "Percentage points of line coverage drop tolerated per module"
    required: false
    default: "0.5"
  fail-on-regression:
    description: "If true, fail the job when any module regresses beyond threshold"
    required: false
    default: "false"
  comment-marker:
    description: "Hidden HTML marker used to find and edit the sticky PR comment"
    required: false
    default: ""
  artifact-name:
    description: >
      Name of the workflow artifact to upload.  The companion
      coverage-comment action must be given the same name on its
      'artifact-name' input so it can locate the artifact on the
      triggering workflow run.
    required: false
    default: ""
  artifact-retention-days:
    description: "Days to retain the uploaded artifact (max 90)."
    required: false
    default: "7"

outputs:
  comment-path:
    description: "Absolute path to the PR comment markdown"
    value: ${{ steps.compare.outputs.comment-path }}
  regressions-json-path:
    description: "Absolute path to a JSON list of regressing modules"
    value: ${{ steps.compare.outputs.regressions-json-path }}

runs:
  using: "composite"
  steps:
    - name: "Resolve defaults from coverage-kind"
      id: defaults
      shell: bash
      env:
        COVERAGE_KIND: ${{ inputs.coverage-kind }}
        MARKER_INPUT: ${{ inputs.comment-marker }}
        ARTIFACT_INPUT: ${{ inputs.artifact-name }}
      run: |
        if [ -z "$MARKER_INPUT" ]; then
          echo "marker=<!-- fprime-${COVERAGE_KIND}-coverage-comment -->" >> "$GITHUB_OUTPUT"
        else
          echo "marker=$MARKER_INPUT" >> "$GITHUB_OUTPUT"
        fi
        if [ -z "$ARTIFACT_INPUT" ]; then
          echo "artifact=fprime-${COVERAGE_KIND}-coverage-comment" >> "$GITHUB_OUTPUT"
        else
          echo "artifact=$ARTIFACT_INPUT" >> "$GITHUB_OUTPUT"
        fi
        # Summary artifact/marker are always derived
        echo "summary-marker=<!-- fprime-${COVERAGE_KIND}-coverage-summary-comment -->" >> "$GITHUB_OUTPUT"
        echo "summary-artifact=fprime-${COVERAGE_KIND}-coverage-summary" >> "$GITHUB_OUTPUT"

    - name: "Fetch baseline branch"
      id: baseline
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        BASELINE_PREFIX: ${{ inputs.baseline-branch-prefix }}
      run: |
        BASELINE_BRANCH="${BASELINE_PREFIX}/${BASE_REF}"
        echo "baseline-branch=${BASELINE_BRANCH}" >> "$GITHUB_OUTPUT"
        BASELINE_DIR="${RUNNER_TEMP:-/tmp}/fprime-coverage-baseline"
        rm -rf "$BASELINE_DIR"
        if git fetch origin "${BASELINE_BRANCH}:refs/remotes/origin/${BASELINE_BRANCH}" 2>/dev/null; then
          git worktree add --detach "$BASELINE_DIR" "origin/${BASELINE_BRANCH}"
          echo "baseline-missing=false" >> "$GITHUB_OUTPUT"
        else
          mkdir -p "$BASELINE_DIR"
          echo "baseline-missing=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Baseline branch ${BASELINE_BRANCH} does not exist; PR comment will note this."
        fi
        echo "baseline-dir=${BASELINE_DIR}" >> "$GITHUB_OUTPUT"

    - name: "Compare against baseline"
      id: compare
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        COMMON_PATH: ${{ github.action_path }}/../coverage-common
        BASELINE_DIR: ${{ steps.baseline.outputs.baseline-dir }}
        BASELINE_MISSING: ${{ steps.baseline.outputs.baseline-missing }}
        BASE_REF: ${{ github.base_ref }}
        THRESHOLD: ${{ inputs.regression-threshold }}
        COVERAGE_KIND: ${{ inputs.coverage-kind }}
        MARKER: ${{ steps.defaults.outputs.marker }}
        FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
        MODULES_JSONL: ${{ inputs.modules-jsonl }}
      run: |
        OUT_DIR="${RUNNER_TEMP:-/tmp}/fprime-coverage-out"
        mkdir -p "$OUT_DIR"
        COMMENT_PATH="$OUT_DIR/comment.md"
        REGRESSIONS_PATH="$OUT_DIR/regressions.json"
        FAIL_FLAG=""
        if [ "$FAIL_ON_REGRESSION" = "true" ]; then
          FAIL_FLAG="--fail-on-regression"
        fi
        MISSING_FLAG=""
        if [ "$BASELINE_MISSING" = "true" ]; then
          MISSING_FLAG="--baseline-missing"
        fi
        SUMMARY_PATH="$OUT_DIR/summary.md"
        python3 "${COMMON_PATH}/scripts/compare.py" \
          --source . \
          --baseline "$BASELINE_DIR" \
          --modules-jsonl "$MODULES_JSONL" \
          --coverage-kind "$COVERAGE_KIND" \
          --base-ref "$BASE_REF" \
          --threshold "$THRESHOLD" \
          --comment-marker "$MARKER" \
          --output "$COMMENT_PATH" \
          --summary-output "$SUMMARY_PATH" \
          --regressions-output "$REGRESSIONS_PATH" \
          $FAIL_FLAG $MISSING_FLAG
        echo "comment-path=$COMMENT_PATH" >> "$GITHUB_OUTPUT"
        echo "regressions-json-path=$REGRESSIONS_PATH" >> "$GITHUB_OUTPUT"
        echo "summary-path=$SUMMARY_PATH" >> "$GITHUB_OUTPUT"

    - name: "Stage comment artifact"
      id: stage
      if: steps.compare.outputs.comment-path != ''
      shell: bash
      env:
        COMMENT_PATH: ${{ steps.compare.outputs.comment-path }}
        REGRESSIONS_PATH: ${{ steps.compare.outputs.regressions-json-path }}
        MARKER: ${{ steps.defaults.outputs.marker }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        ARTIFACT_DIR="${RUNNER_TEMP:-/tmp}/fprime-coverage-artifact"
        rm -rf "$ARTIFACT_DIR"
        mkdir -p "$ARTIFACT_DIR"
        cp "$COMMENT_PATH" "$ARTIFACT_DIR/comment.md"
        if [ -f "$REGRESSIONS_PATH" ]; then
          cp "$REGRESSIONS_PATH" "$ARTIFACT_DIR/regressions.json"
        fi
        if [ -z "$PR_NUMBER" ]; then
          echo "::error::No pull request number available; this action only supports pull_request events."
          exit 1
        fi
        echo "$PR_NUMBER" > "$ARTIFACT_DIR/pr-number.txt"
        echo "$MARKER" > "$ARTIFACT_DIR/comment-marker.txt"
        echo "artifact-dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

    - name: "Upload comment artifact"
      if: steps.stage.outputs.artifact-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.defaults.outputs.artifact }}
        path: ${{ steps.stage.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
        overwrite: true

    - name: "Stage summary artifact"
      id: stage-summary
      if: steps.compare.outputs.summary-path != ''
      shell: bash
      env:
        SUMMARY_PATH: ${{ steps.compare.outputs.summary-path }}
        SUMMARY_MARKER: ${{ steps.defaults.outputs.summary-marker }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        ARTIFACT_DIR="${RUNNER_TEMP:-/tmp}/fprime-coverage-summary-artifact"
        rm -rf "$ARTIFACT_DIR"
        mkdir -p "$ARTIFACT_DIR"
        cp "$SUMMARY_PATH" "$ARTIFACT_DIR/comment.md"
        echo "$PR_NUMBER" > "$ARTIFACT_DIR/pr-number.txt"
        echo "$SUMMARY_MARKER" > "$ARTIFACT_DIR/comment-marker.txt"
        echo "artifact-dir=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

    - name: "Upload summary artifact"
      if: steps.stage-summary.outputs.artifact-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.defaults.outputs.summary-artifact }}
        path: ${{ steps.stage-summary.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: ${{ inputs.artifact-retention-days }}
        overwrite: true

    - name: "Write comment to step summary"
      if: steps.compare.outputs.comment-path != ''
      shell: bash
      env:
        COMMENT_PATH: ${{ steps.compare.outputs.comment-path }}
      run: |
        echo "## Coverage report (preview)" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        cat "$COMMENT_PATH" >> "$GITHUB_STEP_SUMMARY"
