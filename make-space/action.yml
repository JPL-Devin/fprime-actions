name: 'Make Space: Clean-Up the Image'
description: 'A space recovery action for: Ubuntu hosts'
runs:
  using: "composite"
  steps:
  # Inspired by: https://github.com/apache/flink/blob/master/tools/azure-pipelines/free_disk_space.sh
  #         and: https://github.com/marketplace/actions/free-disk-space-ubuntu
  #
  # Space is recovered by deleting directories directly rather than via
  # "apt-get remove": dpkg database and trigger processing made the apt
  # path take minutes, while rm -rf of the same content takes seconds.
  # Removals run in parallel and are followed by a single "wait".
  - run: |
      echo "#######################################################"
      echo "#### Making More Space                             ####"
      echo "#######################################################"
      df -h
      echo "Removing Large Unnecessary Directories"
      sudo rm -rf /usr/share/dotnet /usr/lib/dotnet /opt/ghc /usr/local/.ghcup &
      sudo rm -rf /usr/local/lib/android &
      sudo rm -rf /usr/local/share/powershell /usr/local/share/chromium &
      sudo rm -rf /opt/az /usr/lib/google-cloud-sdk /opt/microsoft /usr/lib/mono &
      sudo rm -rf /opt/google/chrome /usr/lib/firefox /usr/share/swift &
      echo "Pruning Docker Images"
      sudo docker image prune --all --force > /dev/null 2>&1 || true &
      wait
      echo "#######################################################"
      echo "#### Final                                         ####"
      echo "#######################################################"
      df -h
    shell: bash
