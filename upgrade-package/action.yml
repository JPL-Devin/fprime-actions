name: "Upgrade Package for PR Branch"
description: "Upgrades a pip package from a GitHub repository, using a PR-matching branch if available"

inputs:
  repository:
    description: "GitHub repository (owner/repo) to check for matching branch"
    required: true
  default-branch:
    description: "Default branch to use if no PR branch found"
    required: false
    default: "devel"
  pr-branch-only:
    description: "If 'true', only upgrade when a matching pr-<number> branch exists; otherwise leave the pinned version installed (never fall back to the default branch)"
    required: false
    default: "false"

outputs:
  target-branch:
    description: "The branch that was used for the upgrade"
    value: ${{ steps.get_pr_branch.outputs.target-branch }}

runs:
  using: "composite"
  steps:
    - name: "Get PR target branch"
      id: get_pr_branch
      uses: nasa/fprime-actions/get-pr-branch@devel
      with:
        target_repository: ${{ inputs.repository }}
        default_target_ref: ${{ inputs.default-branch }}

    - name: "Upgrade package"
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        TARGET_BRANCH: ${{ steps.get_pr_branch.outputs.target-branch }}
        MATCH_TYPE: ${{ steps.get_pr_branch.outputs.match-type }}
        PR_BRANCH_ONLY: ${{ inputs.pr-branch-only }}
      run: |
        if [[ "${PR_BRANCH_ONLY}" == "true" && "${MATCH_TYPE}" != "pr" ]]; then
          echo "No matching pr branch on ${REPOSITORY}; keeping the pinned version (not upgrading to '${TARGET_BRANCH}')"
          exit 0
        fi
        pip install --upgrade "git+https://github.com/${REPOSITORY}.git@${TARGET_BRANCH}"
