name: "F´ Integration Tests"
description: "Start a ground system (fprime-gds or fprime-yamcs) and flight software, run pytest integration tests, optionally check for memory leaks with valgrind"
inputs:
  ground-system:
    description: "Ground system executable used to run the tests: fprime-gds or fprime-yamcs"
    required: false
    default: "fprime-gds"
  gds-working-directory:
    description: "Deployment directory to start the ground system from (e.g. Ref/)"
    required: true
  test-working-directory:
    description: "Directory to run pytest from (e.g. Ref/test/int)"
    required: true
  binary:
    description: "Path to the FSW binary to run (relative to gds-working-directory)"
    required: true
  binary-args:
    description: "Arguments passed to the FSW binary"
    required: false
    default: "-a 127.0.0.1 -p 50000"
  timeout:
    description: "Timeout in seconds for the pytest run"
    required: false
    default: "300"
  gds-args:
    description: "Extra arguments passed to the ground system (e.g. --dictionary path)"
    required: false
    default: ""
  ready-check:
    description: "Optional shell command polled until success after startup-delay (e.g. a YAMCS client connect check)"
    required: false
    default: ""
  ready-timeout:
    description: "Seconds to wait for ready-check to succeed"
    required: false
    default: "60"
  pytest-args:
    description: "Extra arguments passed to pytest (e.g. --deployment-config path)"
    required: false
    default: ""
  valgrind:
    description: "Run the FSW binary under valgrind for memory leak detection"
    required: false
    default: "false"
  startup-delay:
    description: "Seconds to wait for GDS and flight software to start"
    required: false
    default: "10"
runs:
  using: "composite"
  steps:
    - name: "Integration Tests"
      shell: bash
      env:
        GROUND_SYSTEM: ${{ inputs.ground-system }}
        GDS_WORKING_DIR: ${{ inputs.gds-working-directory }}
        TEST_WORKING_DIR: ${{ inputs.test-working-directory }}
        GDS_ARGS: ${{ inputs.gds-args }}
        BINARY_PATH: ${{ inputs.binary }}
        BINARY_ARGS: ${{ inputs.binary-args }}
        STARTUP_DELAY: ${{ inputs.startup-delay }}
        READY_CHECK: ${{ inputs.ready-check }}
        READY_TIMEOUT: ${{ inputs.ready-timeout }}
        USE_VALGRIND: ${{ inputs.valgrind }}
        TIMEOUT_SECONDS: ${{ inputs.timeout }}
        PYTEST_ARGS: ${{ inputs.pytest-args }}
      run: |
        cd "${GITHUB_WORKSPACE}/${GDS_WORKING_DIR}"
        mkdir -p gds-logs

        # Ensure GDS and FSW are killed on any exit (failure, timeout, success)
        cleanup() {
          kill ${GDS_PID} ${FSW_PID} 2>/dev/null || true
        }
        trap cleanup EXIT

        # Start the ground system (a drop-in fprime-gds replacement) headless (-g none) without
        # the app (-n); we manage the binary separately
        ${GROUND_SYSTEM} -n -g none -l gds-logs ${GDS_ARGS} \
          > gds-logs/${GROUND_SYSTEM}.stdout.log 2> gds-logs/${GROUND_SYSTEM}.stderr.log &
        GDS_PID=$!

        # Start the FSW binary (optionally under valgrind)
        if [ "${USE_VALGRIND}" = "true" ] && command -v valgrind > /dev/null 2>&1; then
          echo "[INFO] Starting FSW binary under valgrind"
          valgrind \
            --tool=memcheck \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=all \
            --track-origins=yes \
            --log-file=gds-logs/valgrind.log \
            ${BINARY_PATH} ${BINARY_ARGS} \
            > gds-logs/fsw.stdout.log 2> gds-logs/fsw.stderr.log &
        else
          echo "[INFO] Starting FSW binary"
          ${BINARY_PATH} ${BINARY_ARGS} \
            > gds-logs/fsw.stdout.log 2> gds-logs/fsw.stderr.log &
        fi
        FSW_PID=$!

        echo "[INFO] Waiting ${STARTUP_DELAY}s for ${GROUND_SYSTEM} and FSW to start"
        sleep "${STARTUP_DELAY}"

        if ! ps -p ${GDS_PID} > /dev/null 2>&1; then
          echo "::error::${GROUND_SYSTEM} failed to start. Logs:"
          cat gds-logs/${GROUND_SYSTEM}.stderr.log
          exit 1
        fi
        if ! ps -p ${FSW_PID} > /dev/null 2>&1; then
          echo "::error::FSW binary failed to start. Logs:"
          cat gds-logs/fsw.stderr.log
          exit 1
        fi

        # Poll the optional readiness check (e.g. ground system client connect) until success
        if [ -n "${READY_CHECK}" ]; then
          READY_DEADLINE=$((SECONDS + READY_TIMEOUT))
          until bash -c "${READY_CHECK}" > /dev/null 2>&1; do
            if [ ${SECONDS} -ge ${READY_DEADLINE} ]; then
              echo "::error::Ready check did not succeed within ${READY_TIMEOUT}s: ${READY_CHECK}"
              exit 1
            fi
            sleep 2
          done
        fi
        echo "[INFO] ${GROUND_SYSTEM} (PID ${GDS_PID}) and FSW (PID ${FSW_PID}) running"

        # Run integration tests
        TIMEOUT_CMD="timeout"
        if ! command -v ${TIMEOUT_CMD} > /dev/null 2>&1; then
          TIMEOUT_CMD="gtimeout"
        fi
        echo "[INFO] Running pytest with ${TIMEOUT_SECONDS}s timeout"
        cd "${GITHUB_WORKSPACE}/${TEST_WORKING_DIR}"
        ${TIMEOUT_CMD} --kill-after=10s "${TIMEOUT_SECONDS}s" pytest ${PYTEST_ARGS}
        RET_PYTEST=$?
        cd "${GITHUB_WORKSPACE}/${GDS_WORKING_DIR}"

        # Stop FSW and capture valgrind exit code via wait (same shell context)
        if ps -p ${FSW_PID} > /dev/null 2>&1; then
          echo "[INFO] Stopping FSW (PID ${FSW_PID})"
          kill ${FSW_PID} 2>/dev/null || true
        fi
        wait ${FSW_PID} 2>/dev/null
        RET_VALGRIND=$?

        # Report results
        if [ ${RET_PYTEST} -ne 0 ]; then
          echo "::error::Integration tests failed (exit code ${RET_PYTEST})"
          exit ${RET_PYTEST}
        fi

        if [ "${USE_VALGRIND}" = "true" ] && [ ${RET_VALGRIND} -ne 0 ]; then
          echo "::error::Valgrind detected memory errors (exit code ${RET_VALGRIND})"
          if [ -f gds-logs/valgrind.log ]; then
            echo "::group::Valgrind Log"
            cat gds-logs/valgrind.log
            echo "::endgroup::"
          fi
          exit 1
        fi

        echo "[INFO] Integration tests passed"
