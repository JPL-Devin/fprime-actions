name: "F´ Build"
description: "Generate and build an F´ deployment or module"
inputs:
  working-directory:
    description: "Directory to run fprime-util from"
    required: false
    default: "."
  generate-args:
    description: "Extra flags passed to fprime-util generate (e.g. -DFPRIME_ENABLE_FRAMEWORK_UTS=OFF)"
    required: false
    default: ""
  build-type:
    description: "CMake build type (e.g. Debug, Release); empty uses the project default"
    required: false
    default: ""
  target-platform:
    description: "Target platform/toolchain passed to fprime-util (e.g. native, aarch64-linux)"
    required: false
    default: ""
  build-all:
    description: "Pass --all to fprime-util build to build all modules"
    required: false
    default: "false"
  jobs:
    description: "Parallel job count: a number, 'random' (1-32), or empty to omit -j"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: "Generate Build Cache"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        GENERATE_ARGS: ${{ inputs.generate-args }}
        BUILD_TYPE: ${{ inputs.build-type }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
      run: |
        if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
          VERBOSE_FLAG=--verbose
        else
          VERBOSE_FLAG=
        fi
        BUILD_TYPE_ARG=""
        if [ -n "${BUILD_TYPE}" ]; then
          BUILD_TYPE_ARG="-DCMAKE_BUILD_TYPE=${BUILD_TYPE}"
        fi
        set -o pipefail
        chmod +x "${GITHUB_ACTION_PATH}/../output-cleaner/output-cleaner"
        fprime-util generate ${VERBOSE_FLAG} ${BUILD_TYPE_ARG} ${GENERATE_ARGS} ${TARGET_PLATFORM} 2>&1 | "${GITHUB_ACTION_PATH}/../output-cleaner/output-cleaner"
    - name: "Build"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        BUILD_ALL: ${{ inputs.build-all }}
        JOBS_INPUT: ${{ inputs.jobs }}
        TARGET_PLATFORM: ${{ inputs.target-platform }}
      run: |
        ALL_FLAG=""
        if [ "${BUILD_ALL}" = "true" ]; then
          ALL_FLAG="--all"
        fi
        JOBS_FLAG=""
        if [ "${JOBS_INPUT}" = "random" ]; then
          JOBS=$(( (RANDOM % 32) + 1 ))
          JOBS_FLAG="-j${JOBS}"
          echo "Building with ${JOBS} parallel jobs (randomized 1-32)"
        elif [ -n "${JOBS_INPUT}" ]; then
          JOBS_FLAG="-j${JOBS_INPUT}"
          echo "Building with ${JOBS_INPUT} parallel jobs"
        else
          echo "Building with default parallelism"
        fi
        if [ "${RUNNER_DEBUG:-0}" = "1" ]; then
          VERBOSE_FLAG=--verbose
        else
          VERBOSE_FLAG=
        fi
        set -o pipefail
        chmod +x "${GITHUB_ACTION_PATH}/../output-cleaner/output-cleaner"
        fprime-util build ${ALL_FLAG} ${JOBS_FLAG} ${VERBOSE_FLAG} ${TARGET_PLATFORM} 2>&1 | "${GITHUB_ACTION_PATH}/../output-cleaner/output-cleaner"
